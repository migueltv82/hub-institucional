name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate (Node 22.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node y cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del lockfile
        run: npm ci

      - name: Ejecutar quality gate local
        run: npm run check
