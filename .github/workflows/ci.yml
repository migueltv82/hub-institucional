name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Calidad (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node 22 y caché npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias del lockfile
        run: npm ci

      - name: Auditar el repositorio
        run: npm run audit:repo

      - name: Validar lint
        run: npm run lint

      - name: Ejecutar tests
        run: npm test

      - name: Compilar y auditar producción
        run: npm run build
        env:
          VITE_DISABLE_AUTH: 'false'
